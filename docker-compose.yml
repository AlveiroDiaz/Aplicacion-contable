services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: motor_contable
    # Sin "ports": solo el contenedor "backend" necesita hablarle a la base,
    # y lo hace por la red interna de Docker (hostname "db"). No hace
    # falta (ni conviene) exponer Postgres directo a internet.
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./motor-contable-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/motor_contable
      # Cambia esto en cualquier servidor real: es la clave que firma los
      # JWT. Si no la sobreescribes, cualquiera que lea este repo público
      # conoce la clave por defecto y podría forjar tokens válidos.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cambia-esta-clave-en-produccion}
      JWT_EXPIRE_MINUTES: "480"
      # Orígenes desde los que el navegador puede llamar a la API. En local
      # es localhost:3000; en un servidor, la URL pública real del frontend.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-contable
      args:
        # NEXT_PUBLIC_* se compila DENTRO del bundle de producción (next
        # build), así que tiene que llegar como build-arg, no solo como
        # variable de entorno del contenedor. Si cambias esta URL, hace
        # falta reconstruir la imagen (docker compose up -d --build
        # frontend), no solo recrear el contenedor.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  db_data:
