services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: motor_contable
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./motor-contable-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/motor_contable
      # Cambia esta clave si vas a exponer el proyecto más allá de tu
      # máquina; ver README para el resto de variables de entorno.
      JWT_SECRET_KEY: cambia-esta-clave-en-produccion
      JWT_EXPIRE_MINUTES: "480"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-contable
    environment:
      # El navegador (no el contenedor) es quien llama a esta URL, por eso
      # apunta a localhost:8000 y no al hostname interno "backend".
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
